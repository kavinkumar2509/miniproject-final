version: '3.8'

services:
  # 1. React Frontend SPA (Nginx)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: sih-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sih-network

  # 2. Node.js Express REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/sih
      - ML_SERVICE_URL=http://ml-service:5001
    depends_on:
      - mongodb
      - ml-service
    restart: unless-stopped
    networks:
      - sih-network

  # 3. FastAPI Python ML Epidemiological Prediction Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: sih-ml-service
    ports:
      - "5001:5001"
    restart: unless-stopped
    networks:
      - sih-network

  # 4. MongoDB Database Engine
  mongodb:
    image: mongo:6.0
    container_name: sih-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - sih-network

volumes:
  mongo-data:
    driver: local

networks:
  sih-network:
    driver: bridge
